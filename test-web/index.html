<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Калькулятор: завжди "Привіт, світ!"</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f8fa;
      color: #1f1f1f;
      overflow: hidden;
      padding: 20px;
    }

    .background-circle {
      position: absolute;
      width: 500px;
      height: 500px;
      background: #ffe3cf;
      border-radius: 50%;
      filter: blur(80px);
      top: -150px;
      right: -100px;
      opacity: 0.7;
      z-index: 0;
    }

    .card {
      position: relative;
      max-width: 700px;
      width: 100%;
      background: white;
      border-radius: 35px;
      padding: 60px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
      border: 1px solid #ececec;
      z-index: 2;
      transition: all 0.2s ease;
    }

    /* стиль для заголовка та відповіді */
    .greeting-icon {
      font-size: 56px;
      margin-bottom: 10px;
      display: inline-block;
    }

    .section-title {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #1f1f1f;
      letter-spacing: -0.3px;
    }

    .sub {
      color: #ff9b63;
      font-weight: 500;
      background: #fff1e8;
      display: inline-block;
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 14px;
      margin-bottom: 25px;
    }

    /* поле вводу рівняння */
    .equation-area {
      margin: 15px 0 10px;
    }

    .equation-input {
      width: 100%;
      padding: 18px 20px;
      font-size: 18px;
      background: #f9f9fc;
      border: 1.5px solid #e6e9f0;
      border-radius: 28px;
      outline: none;
      transition: 0.2s;
      color: #1f1f1f;
      text-align: center;
      font-family: 'Courier New', monospace;
      font-weight: 500;
    }

    .equation-input:focus {
      border-color: #ff9b63;
      box-shadow: 0 0 0 3px rgba(255, 155, 99, 0.2);
    }

    .equation-input::placeholder {
      color: #b9c0ce;
      font-family: Arial, sans-serif;
      font-size: 15px;
    }

    /* кнопки */
    .buttons-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 30px 0 30px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      background: #ff9b63;
      color: white;
      border: none;
      border-radius: 40px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.02);
    }

    .btn:hover {
      background: #f0864b;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-clear {
      background: #eef2f9;
      color: #4a5568;
      box-shadow: none;
    }

    .btn-clear:hover {
      background: #e2e8f2;
      transform: translateY(-2px);
      color: #1a2634;
    }

    /* блок результату */
    .result-block {
      background: #fffaf5;
      border-radius: 32px;
      padding: 20px 18px;
      margin-top: 20px;
      border: 1px solid #ffe0cf;
    }

    .result-label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ff9b63;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .result-text {
      font-size: 44px;
      font-weight: 800;
      color: #ff9b63;
      background: linear-gradient(135deg, #ff9b63, #ffb77c);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      word-break: break-word;
      font-family: 'Courier New', monospace;
      letter-spacing: -0.5px;
    }

    /* маленький жартівливий футер */
    .fun-note {
      font-size: 13px;
      color: #9aa7b9;
      margin-top: 28px;
      padding-top: 10px;
      border-top: 1px dashed #e6dfd9;
    }

    @media (max-width: 768px) {
      .card {
        padding: 40px 25px;
      }
      .result-text {
        font-size: 32px;
      }
      .section-title {
        font-size: 26px;
      }
      .btn {
        padding: 12px 24px;
        font-size: 16px;
      }
      .equation-input {
        padding: 14px 18px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

<div class="background-circle"></div>

<div class="card">
  <div class="greeting-icon">🌍✨</div>
  <div class="section-title">Калькулятор рівнянь</div>
  <div class="sub">✧ особливий алгоритм ✧</div>

  <div class="equation-area">
    <input type="text" id="equationInput" class="equation-input" 
           placeholder="Наприклад: 2x + 5 = 13   або   sin(90°) + log(100)" 
           autocomplete="off">
  </div>

  <div class="buttons-group">
    <button class="btn" id="solveBtn">📐 Розв’язати</button>
    <button class="btn btn-clear" id="clearBtn">🧹 Очистити</button>
  </div>

  <div class="result-block">
    <div class="result-label">★ Відповідь системи ★</div>
    <div class="result-text" id="resultOutput">Привіт, світ!</div>
  </div>
  <div class="fun-note">
    💡 Будь-яке рівняння → <strong>«Привіт, світ!»</strong> (універсальна істина)
  </div>
</div>

<script>
  (function() {
    // Отримуємо DOM-елементи
    const equationInput = document.getElementById('equationInput');
    const solveBtn = document.getElementById('solveBtn');
    const clearBtn = document.getElementById('clearBtn');
    const resultOutput = document.getElementById('resultOutput');

    // Функція, яка встановлює фінальну відповідь "Привіт, світ!"
    // (і виконує вимогу ТЗ: будь-яке рівняння → Hello, world! українською)
    function setUniversalAnswer() {
      resultOutput.textContent = "Привіт, світ!";
      // Легка анімація для кліку (додає дружнього ефекту)
      resultOutput.style.transform = "scale(1.02)";
      setTimeout(() => {
        if (resultOutput) resultOutput.style.transform = "";
      }, 150);
    }

    // Головна дія "Розв’язати" — незалежно від вводу, виводимо "Привіт, світ!"
    function onSolve() {
      const userEquation = equationInput.value.trim();
      
      // Логування для консолі (чисто для демонстрації, але результат не залежить)
      if (userEquation === "") {
        console.log("📭 Рівняння не введено, але калькулятор дарує: Привіт, світ!");
      } else {
        console.log(`📐 Отримано рівняння: "${userEquation}" → Відповідь завжди "Привіт, світ!"`);
      }
      
      // Встановлюємо чарівну відповідь
      setUniversalAnswer();
      
      // Ефект натискання на кнопку
      solveBtn.style.transform = "scale(0.97)";
      setTimeout(() => { if(solveBtn) solveBtn.style.transform = ""; }, 120);
    }
    
    // Очищення поля вводу — відповідь залишається "Привіт, світ!" (згідно ТЗ)
    function onClear() {
      equationInput.value = "";
      // Після очищення, результат не змінюється — він все ще "Привіт, світ!"
      // Але зробимо невелике підсвічування для задоволення
      if (resultOutput.textContent !== "Привіт, світ!") {
        // Захист: якщо якимось чином змінилося (наприклад, через інспектор) — повертаємо істину
        resultOutput.textContent = "Привіт, світ!";
      } else {
        // легке миготіння для підтвердження
        resultOutput.style.opacity = "0.7";
        setTimeout(() => { if(resultOutput) resultOutput.style.opacity = "1"; }, 180);
      }
      console.log("🧹 Поле очищено, відповідь залишається: Привіт, світ!");
      equationInput.focus();
    }
    
    // Обробник клавіші Enter (щоб при натисканні Enter також була відповідь)
    function onEnterPress(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        onSolve();
      }
    }
    
    // Додаткова гарантія: якщо хтось намагається через консоль змінити текст відповіді,
    // але це не порушує ТЗ, тому що користувач використовує інтерфейс — при будь-якому розв'язанні
    // знову буде "Привіт, світ!". Однак, додамо спостереження за вмістом? Не обов'язково.
    // Але для ідеальної відповідності: переконаємось, що результат при старті сторінки — правильний.
    
    // Підписуємось на події
    solveBtn.addEventListener('click', onSolve);
    clearBtn.addEventListener('click', onClear);
    equationInput.addEventListener('keypress', onEnterPress);
    
    // Ініціалізація: результат за замовчуванням "Привіт, світ!" (якщо раптом HTML має інше)
    if (resultOutput.textContent !== "Привіт, світ!") {
      resultOutput.textContent = "Привіт, світ!";
    }
    
    // Додатковий захист від випадкових змін: можна зберігати правильне значення при фокусі втрати,
    // але ТЗ чітке: при воді будь-якого рівняння у відповіді "Привіт, світ!". Наш solve завжди викликається.
    // Щоб задовольнити вимогу "при воді любого уравнення в ответе будет ..." — саме клік по кнопці або Enter.
    // Також додамо можливість "оновлення" через кнопку, але це і так є.
    
    // Демонстраційне повідомлення в консоль (веселий старт)
    console.log("%c✨ КАЛЬКУЛЯТОР ГОТОВИЙ: будь-яке рівняння → 'Привіт, світ!' ✨", "color: #ff9b63; font-size: 14px; font-weight: bold;");
    
    // Додамо підказку на поле вводу (title)
    equationInput.setAttribute('title', 'Введіть будь-яке рівняння — відповідь завжди "Привіт, світ!"');
    
    // Невелика анімація при завантаженні: ніжне підсвічування результату
    setTimeout(() => {
      if(resultOutput) {
        resultOutput.style.transition = "0.2s";
        resultOutput.style.textShadow = "0 0 6px #ffcfb0";
        setTimeout(() => {
          if(resultOutput) resultOutput.style.textShadow = "";
        }, 500);
      }
    }, 150);
  })();
</script>
</body>
</html>
