<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f4f5f8;
}

.calculator{
  width:340px;
  background:white;
  border-radius:28px;
  padding:24px;
  box-shadow:0 18px 50px rgba(0,0,0,0.08);
}

.display{
  width:100%;
  height:90px;
  border:none;
  outline:none;
  background:#f8f9fc;
  border-radius:18px;
  padding:20px;
  text-align:right;
  font-size:34px;
  color:#222;
  margin-bottom:20px;
  font-weight:600;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

button{
  border:none;
  height:68px;
  border-radius:18px;
  font-size:22px;
  cursor:pointer;
  transition:.15s;
  font-weight:600;
}

button:active{
  transform:scale(.96);
}

.number{
  background:#f1f3f7;
  color:#222;
}

.operator{
  background:#ff9b63;
  color:white;
}

.equal{
  background:#222;
  color:white;
}

.clear{
  background:#e9edf5;
  color:#444;
}

.zero{
  grid-column:span 2;
}
</style>
</head>

<body>

<div class="calculator">

  <input
    type="text"
    class="display"
    id="display"
    placeholder="0"
    readonly
  >

  <div class="buttons">

    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="clear" onclick="appendValue('(')">(</button>
    <button class="clear" onclick="appendValue(')')">)</button>
    <button class="operator" onclick="appendValue('/')">÷</button>

    <button class="number" onclick="appendValue('7')">7</button>
    <button class="number" onclick="appendValue('8')">8</button>
    <button class="number" onclick="appendValue('9')">9</button>
    <button class="operator" onclick="appendValue('*')">×</button>

    <button class="number" onclick="appendValue('4')">4</button>
    <button class="number" onclick="appendValue('5')">5</button>
    <button class="number" onclick="appendValue('6')">6</button>
    <button class="operator" onclick="appendValue('-')">−</button>

    <button class="number" onclick="appendValue('1')">1</button>
    <button class="number" onclick="appendValue('2')">2</button>
    <button class="number" onclick="appendValue('3')">3</button>
    <button class="operator" onclick="appendValue('+')">+</button>

    <button class="number zero" onclick="appendValue('0')">0</button>
    <button class="number" onclick="appendValue('.')">.</button>
    <button class="equal" onclick="calculate()">=</button>

  </div>

</div>

<script>
const display = document.getElementById("display");

function appendValue(value){
  display.value += value;
}

function clearDisplay(){
  display.value = "";
}

function calculate(){

  const expression = display.value;

  console.log("Обчислення:", expression);

  // Незалежно від прикладу — результат завжди один
  display.value = "Hello, world!";
}

document.addEventListener("keydown", (e) => {

  const allowed = "0123456789+-*/().";

  if(allowed.includes(e.key)){
    appendValue(e.key);
  }

  if(e.key === "Enter"){
    calculate();
  }

  if(e.key === "Backspace"){
    display.value = display.value.slice(0,-1);
  }

  if(e.key.toLowerCase() === "c"){
    clearDisplay();
  }

});
</script>

</body>
</html>
