<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Сторінку не знайдено</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f8fa;
      color: #1f1f1f;
      overflow: hidden;
      padding: 20px;
    }

    .background-circle {
      position: absolute;
      width: 500px;
      height: 500px;
      background: #ffe3cf;
      border-radius: 50%;
      filter: blur(80px);
      top: -150px;
      right: -100px;
      opacity: 0.7;
    }

    .card {
      position: relative;
      max-width: 700px;
      width: 100%;
      background: white;
      border-radius: 35px;
      padding: 60px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
      border: 1px solid #ececec;
    }

    .error-code {
      font-size: 120px;
      font-weight: bold;
      color: #ff9b63;
      line-height: 1;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      color: #666;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    .btn {
      display: inline-block;
      padding: 16px 32px;
      background: #ff9b63;
      color: white;
      text-decoration: none;
      border-radius: 16px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #f0864b;
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .card {
        padding: 40px 25px;
      }

      .error-code {
        font-size: 80px;
      }

      h1 {
        font-size: 30px;
      }

      p {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <div class="background-circle"></div>

  <div class="card">
    <div class="error-code">404</div>

    <h1>Сторінку не знайдено</h1>

    <p>
      Ми працюємо над тим, щоб зробити цю сторінку.<br>
      Або вона нам просто не дуже потрібна.<br><br>

      Вибирайте самі, що вам ближче до душі.
    </p>

    <a href="index.html" class="btn">
      Повернутись на головну
    </a>
  </div>

</body>
</html>
